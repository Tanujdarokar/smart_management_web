<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | SmartTask Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Settings</h1>
                    <p style="color: var(--text-muted);">Manage your account and app preferences.</p>
                </div>
            </header>

            <div style="max-width: 800px; display: grid; gap: 32px;">
                <!-- Profile Section -->
                <section class="card">
                    <h2 style="font-size: 18px; margin-bottom: 24px;">Profile Settings</h2>
                    <form id="profileForm">
                        <div style="display: flex; align-items: center; gap: 24px; margin-bottom: 24px;">
                            <div class="avatar" id="settingsAvatar" style="width: 80px; height: 80px; font-size: 32px;">JD</div>
                            <div>
                                <button type="button" class="btn btn-outline btn-sm">Change Avatar</button>
                                <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">JPG, GIF or PNG. Max size 800K</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="settingsName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="settingsEmail" class="form-control" readonly>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </section>

                <!-- Appearance Section -->
                <section class="card">
                    <h2 style="font-size: 18px; margin-bottom: 24px;">Appearance</h2>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
                        <div class="theme-option" data-theme="light">
                            <div class="theme-preview light"></div>
                            <p>Light Mode</p>
                        </div>
                        <div class="theme-option" data-theme="dark">
                            <div class="theme-preview dark"></div>
                            <p>Dark Mode</p>
                        </div>
                        <div class="theme-option" data-theme="system">
                            <div class="theme-preview system"></div>
                            <p>System</p>
                        </div>
                    </div>
                </section>

                <!-- Account Section -->
                <section class="card">
                    <h2 style="font-size: 18px; margin-bottom: 24px; color: var(--cancelled);">Danger Zone</h2>
                    <p style="color: var(--text-muted); margin-bottom: 16px;">Once you delete your account, there is no going back. Please be certain.</p>
                    <button class="btn btn-outline" style="color: var(--cancelled); border-color: var(--cancelled);" id="deleteAccountBtn">
                        Delete Account
                    </button>
                </section>
            </div>
        </main>
    </div>

    <script type="module" src="js/settings.js"></script>
</body>
</html>
