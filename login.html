<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your SmartTask Manager workspace and keep your tasks, plans, and projects organized.">
    <meta name="robots" content="noindex, nofollow">
    <title>Login | SmartTask Manager</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script type="module" src="js/privacy.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-brand-badge">✨</div>
                <h1>SmartTask</h1>
                <p>Welcome back! Sign in to access your tasks.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" autocomplete="email" maxlength="254" placeholder="name@company.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="rememberMe" style="width: auto; cursor: pointer;">
                    <label for="rememberMe" style="margin-bottom: 0; font-size: 13px; cursor: pointer;">Remember Me</label>
                </div>

                <button type="submit" class="btn btn-primary auth-btn">Sign In to Dashboard →</button>
                <button type="button" id="guestLoginBtn" class="btn btn-outline auth-btn" style="margin-top: 10px;">Continue as Guest</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Sign Up</a>
                <p><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
