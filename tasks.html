<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | SmartTask Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tasks.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar injected by JS -->
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <h1>My Tasks</h1>
                    <p style="color: var(--text-muted);">Manage, filter, and track your daily work.</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="addNewTask">
                        <span>✨</span> Create Task
                    </button>
                </div>
            </header>

            <!-- Filters & Search Bar -->
            <div class="card filters-card">
                <div class="filters-grid">
                    <div class="filter-group">
                        <input type="text" id="taskSearch" placeholder="🔍 Search tasks by title or description..." class="form-control">
                    </div>
                    <div class="filter-group">
                        <select id="statusFilter" class="form-control">
                            <option value="all">⚡ All Statuses</option>
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="priorityFilter" class="form-control">
                            <option value="all">🎯 All Priorities</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="sortBy" class="form-control">
                            <option value="newest">📅 Newest First</option>
                            <option value="dueDate">⏳ Due Date</option>
                            <option value="priority">🔥 Priority Level</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Task Grid -->
            <div id="taskList" class="task-grid">
                <!-- Tasks will be injected here -->
            </div>

            <div id="emptyTasks" class="empty-state card" style="display: none; margin-top: 24px;">
                <div style="font-size: 54px; margin-bottom: 12px; opacity: 0.8;">📂</div>
                <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--text-main);">No tasks found</h3>
                <p style="color: var(--text-muted); font-size: 14px;">Try adjusting your filters or create a new task to get started.</p>
            </div>
        </main>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Task</h2>
                <span class="close-modal">&times;</span>
            </div>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-row">
                    <label for="title">Task Title</label>
                    <input type="text" id="title" required placeholder="What needs to be done?">
                </div>
                <div class="form-row">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3" placeholder="Add more context, details, or notes..."></textarea>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" placeholder="e.g. Work, Design">
                    </div>
                    <div class="form-group">
                        <label for="dueDate">Due Date</label>
                        <input type="date" id="dueDate" required>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority">
                            <option value="Low">🟢 Low</option>
                            <option value="Medium" selected>🔵 Medium</option>
                            <option value="High">🟠 High</option>
                            <option value="Critical">🔴 Critical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status">
                            <option value="Pending">⏳ Pending</option>
                            <option value="In Progress">🔄 In Progress</option>
                            <option value="Completed">✅ Completed</option>
                            <option value="Cancelled">🚫 Cancelled</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <label for="tags">Tags (comma separated)</label>
                    <input type="text" id="tags" placeholder="urgent, client, feature">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary close-modal-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/tasks.js"></script>
</body>
</html>
