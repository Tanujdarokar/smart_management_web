<!DOCTYPE html>

<head>

        .not-found { min-height: 70vh; display: grid; place-items: center; text-align: center; }

<body>
    <main class="landing">
        <nav class="landing-nav"><a class="landing-brand" href="index.html"><span aria-hidden="true">✓</span> SmartTask</a></nav>

            <div>
                <h1>404</h1>
                <h2>We couldn’t find that page.</h2>
                <p>The address may be outdated, or the page may have moved. Head back to your workspace and keep going.</p>
                <a class="btn btn-primary landing-cta" href="index.html">Back to SmartTask <span aria-hidden="true">→</span></a>
